# === Claude Code Session Data (primary telemetry) ===
# NOTE (corrected 2026-07-24, superseding an earlier wrong claim in this
# comment): ALL live-ingested events -- main session AND every subagent
# transcript alike -- land as bare sourcetype=claude:code. There is no
# claude:code:subagent in production; that sourcetype has had zero events
# over a 7-day window verified directly against the index (`index=claude
# source="*/subagents/*" | stats count by sourcetype` returns only
# `claude:code`). The only reliable way to distinguish a subagent transcript
# from the main session is the `source` file path containing `/subagents/`
# -- sourcetype gives no signal for this at all. This stanza and every
# macro/eventtype hardcoding the literal "claude:code:session"
# (claude_assistant_events, claude_all_session_events in macros.conf; the
# claude_* stanzas in eventtypes.conf) currently match zero events at the
# ingestion boundary actually in use. Query production with
# sourcetype=claude:code* (wildcard) until this is renamed/aliased to match
# reality; the field extractions below still apply once matched.
[claude:code:session]
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 0
# TIME_PREFIX anchors timestamp parsing for direct/raw ingest paths. The
# normal Cribl Stream -> HEC path delivers event time via the HEC `time`
# request field, which takes precedence over in-body parsing.
TIME_PREFIX = "timestamp":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%Z
MAX_TIMESTAMP_LOOKAHEAD = 30

# Flattened convenience fields (aligned with ccusage 4-token model)
EVAL-input_tokens = coalesce('message.usage.input_tokens', 0)
EVAL-output_tokens = coalesce('message.usage.output_tokens', 0)
EVAL-cache_read_tokens = coalesce('message.usage.cache_read_input_tokens', 0)
EVAL-cache_creation_tokens = coalesce('message.usage.cache_creation_input_tokens', 0)
EVAL-total_tokens = coalesce('message.usage.input_tokens',0) + coalesce('message.usage.output_tokens',0) + coalesce('message.usage.cache_read_input_tokens',0) + coalesce('message.usage.cache_creation_input_tokens',0)
EVAL-model = 'message.model'
EVAL-stop_reason = 'message.stop_reason'

# Deduplication key (ccusage pattern: messageId:requestId).
# Null-safe: `dedup` drops events whose key is null, so events missing
# requestId (synthetic/local messages) fall back to uuid/"noreq".
EVAL-dedup_key = coalesce('message.id', uuid).":".coalesce(requestId, "noreq")

# CIM Base Fields (Web data model + standard)
EVAL-vendor = "anthropic"
EVAL-product = "claude_code"
EVAL-vendor_product = "anthropic_claude_code"
EVAL-app = "claude_code"
EVAL-action = type
FIELDALIAS-cim_dest = message.model AS dest
FIELDALIAS-cim_session_id = sessionId AS session_id

# OTel GenAI Semantic Convention Aliases.
# Semantics split: the native convenience field `input_tokens` is UNCACHED
# input only (Anthropic API / ccusage semantics), while OTel semconv says
# gen_ai.usage.input_tokens SHOULD include cached tokens — so it is computed
# as input + cache_read + cache_creation. The granular cache counts remain
# available as gen_ai.usage.cache_read.input_tokens and
# gen_ai.usage.cache_creation.input_tokens.
EVAL-gen_ai.provider.name = "anthropic"
EVAL-gen_ai.operation.name = "chat"
FIELDALIAS-otel_response_model = message.model AS gen_ai.response.model
FIELDALIAS-otel_conversation_id = sessionId AS gen_ai.conversation.id
EVAL-gen_ai.usage.input_tokens = coalesce('message.usage.input_tokens',0) + coalesce('message.usage.cache_read_input_tokens',0) + coalesce('message.usage.cache_creation_input_tokens',0)
FIELDALIAS-otel_output_tokens = message.usage.output_tokens AS gen_ai.usage.output_tokens
FIELDALIAS-otel_cache_read = message.usage.cache_read_input_tokens AS gen_ai.usage.cache_read.input_tokens
FIELDALIAS-otel_cache_creation = message.usage.cache_creation_input_tokens AS gen_ai.usage.cache_creation.input_tokens
FIELDALIAS-otel_finish_reason = message.stop_reason AS gen_ai.response.finish_reasons

# === Claude Code Subagent Data ===
# NOTE (2026-07-24): this sourcetype currently receives ZERO events in
# production -- see the corrected note on [claude:code:session] above.
# Subagent transcripts also land as bare claude:code; identify them by
# `source` containing `/subagents/` instead. Left defined here (dormant) in
# case the Cribl-side stamping is ever fixed to match; do not rely on it.
[claude:code:subagent]
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 0
TIME_PREFIX = "timestamp":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%Z
MAX_TIMESTAMP_LOOKAHEAD = 30
EVAL-input_tokens = coalesce('message.usage.input_tokens', 0)
EVAL-output_tokens = coalesce('message.usage.output_tokens', 0)
EVAL-cache_read_tokens = coalesce('message.usage.cache_read_input_tokens', 0)
EVAL-cache_creation_tokens = coalesce('message.usage.cache_creation_input_tokens', 0)
EVAL-total_tokens = coalesce('message.usage.input_tokens',0) + coalesce('message.usage.output_tokens',0) + coalesce('message.usage.cache_read_input_tokens',0) + coalesce('message.usage.cache_creation_input_tokens',0)
EVAL-model = 'message.model'
EVAL-stop_reason = 'message.stop_reason'
EVAL-dedup_key = coalesce('message.id', uuid).":".coalesce(requestId, "noreq")
EVAL-vendor = "anthropic"
EVAL-product = "claude_code"
EVAL-vendor_product = "anthropic_claude_code"
EVAL-app = "claude_code"
EVAL-action = type
EVAL-gen_ai.provider.name = "anthropic"
EVAL-gen_ai.operation.name = "chat"
FIELDALIAS-otel_response_model = message.model AS gen_ai.response.model
FIELDALIAS-otel_conversation_id = sessionId AS gen_ai.conversation.id
EVAL-gen_ai.usage.input_tokens = coalesce('message.usage.input_tokens',0) + coalesce('message.usage.cache_read_input_tokens',0) + coalesce('message.usage.cache_creation_input_tokens',0)
FIELDALIAS-otel_output_tokens = message.usage.output_tokens AS gen_ai.usage.output_tokens
FIELDALIAS-otel_cache_read = message.usage.cache_read_input_tokens AS gen_ai.usage.cache_read.input_tokens
FIELDALIAS-otel_cache_creation = message.usage.cache_creation_input_tokens AS gen_ai.usage.cache_creation.input_tokens

