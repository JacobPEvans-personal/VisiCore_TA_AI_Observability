# === macOS Performance Telemetry (cc-edge-the-mac-pack-io) ===
[macos:perf:snapshot]
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 0
TIME_PREFIX = "ts":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%6N%z
MAX_TIMESTAMP_LOOKAHEAD = 40
EVAL-vendor = "apple"
EVAL-product = "macos"
EVAL-vendor_product = "apple_macos"
EVAL-app = "mac_perf_snapshot"

[macos:perf:powermetrics]
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 0
# Do not autodetect a timestamp from the powermetrics event body (avoids
# spurious matches in the JSON payload). `DATETIME_CONFIG = CURRENT` makes
# Splunk default _time to receipt/index time. Cribl-assigned event time
# arrives via the HEC `time` request field (Stream's Splunk HEC destination
# emits this from the parsed _time), so Splunk's actual _time is the Cribl
# upstream value, not the in-body JSON timestamp.
DATETIME_CONFIG = CURRENT
EVAL-vendor = "apple"
EVAL-product = "macos"
EVAL-vendor_product = "apple_macos"
EVAL-app = "mac_perf_powermetrics"

# Remaining cc-edge-the-mac-pack-io sourcetypes (set by the pack's Edge
