# Model pricing lookup.
# WILDCARD match: patterns live in the model_pattern CSV column; only `*` is
# special ( `[`, `]`, `<`, `>` match literally, so `claude-fable-5*` covers
# `claude-fable-5[1m]` and `<synthetic>` matches exactly).
# max_matches = 1 makes the FIRST matching row in CSV file order win, so the
# CSV must be ordered most-specific first with the `*` catch-all as the last
# row. Without max_matches = 1 every matching row is returned and the cost
# fields become multivalue, silently breaking `calculate_cost`.
[ai_model_pricing]
filename = ai_model_pricing.csv
match_type = WILDCARD(model_pattern)
max_matches = 1
case_sensitive_match = false
