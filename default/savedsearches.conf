[LiteLLM price file to lookup]
search = index=llm_pricefeed sourcetype="litellm:price" earliest=-30h | stats latest(input_cost_per_token) AS input_cost_per_token latest(output_cost_per_token) AS output_cost_per_token latest(cache_read_input_token_cost) AS cache_read_input_token_cost latest(cache_creation_input_token_cost) AS cache_creation_input_token_cost by model | where isnotnull(input_cost_per_token) AND isnotnull(output_cost_per_token) | outputlookup createinapp=true override_if_empty=false append=false litellm_model_prices.csv
enableSched = 1
cron_schedule = 30 4 * * *
dispatch.earliest_time = -30h
dispatch.latest_time = now
run_on_startup = false
