[LiteLLM price file to lookup]
search = index=llm_pricefeed sourcetype="litellm:pricefile" | where _time >= relative_time(now(), "-30h") | sort 0 - _time | head 1 | spath | fields - _raw _time _indextime host source sourcetype splunk_server | transpose 0 column_name=rate_path | rename "row 1" AS rate_value | rex field=rate_path "^(?<model>.+)[.](?<rate_name>input_cost_per_token|output_cost_per_token|cache_read_input_token_cost|cache_creation_input_token_cost)$" | where isnotnull(model) | eval rate_value=tonumber(rate_value) | stats max(eval(if(rate_name="input_cost_per_token",rate_value,null()))) AS input_cost_per_token max(eval(if(rate_name="output_cost_per_token",rate_value,null()))) AS output_cost_per_token max(eval(if(rate_name="cache_read_input_token_cost",rate_value,null()))) AS cache_read_input_token_cost max(eval(if(rate_name="cache_creation_input_token_cost",rate_value,null()))) AS cache_creation_input_token_cost by model | where isnotnull(input_cost_per_token) AND isnotnull(output_cost_per_token) | fields model input_cost_per_token output_cost_per_token cache_read_input_token_cost cache_creation_input_token_cost | outputlookup createinapp=true override_if_empty=false append=false litellm_model_prices.csv
enableSched = 1
cron_schedule = 30 4 * * *
dispatch.earliest_time = -30h
dispatch.latest_time = now
run_on_startup = false
