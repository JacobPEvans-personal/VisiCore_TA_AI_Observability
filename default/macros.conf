# === Index macros (user-customizable; override in local/ on your search head) ===
[claude_index]
definition = (index=claude)
iseval = 0

[gemini_index]
definition = (index=gemini)
iseval = 0

[openai_index]
definition = (index=openai)
iseval = 0

[copilot_index]
definition = (index=vscode)
iseval = 0

# Composed from the per-provider index macros so a local/ override of any one
# of them propagates here. v0.2.0: index=ai dropped (nothing produces into it).
[ai_all_indexes]
definition = (`claude_index` OR `gemini_index` OR `openai_index` OR `copilot_index`)
iseval = 0

# === Base filter macros ===
[claude_assistant_events]
definition = `claude_index` sourcetype="claude:code:session" type="assistant"
iseval = 0

[claude_all_session_events]
definition = `claude_index` (sourcetype="claude:code:session" OR sourcetype="claude:code:subagent")
iseval = 0

# === Deduplication (ccusage pattern: messageId:requestId) ===
# Null-safe: dedup drops events whose key is null (keepempty defaults to
# false), so events missing requestId (synthetic/local messages) must fall
# back to uuid/"noreq" instead of producing a null key.
[dedup_messages]
definition = eval dedup_key=coalesce('message.id', uuid).":".coalesce(requestId, "noreq") | dedup dedup_key
iseval = 0

# === Token extraction (canonical 4-token model, ccusage-aligned) ===
# Canonical convenience fields match the props.conf EVALs:
# input_tokens, output_tokens, cache_read_tokens, cache_creation_tokens, total_tokens.
[extract_tokens]
definition = eval input_tokens=coalesce('message.usage.input_tokens',0), \
  output_tokens=coalesce('message.usage.output_tokens',0), \
  cache_read_tokens=coalesce('message.usage.cache_read_input_tokens',0), \
  cache_creation_tokens=coalesce('message.usage.cache_creation_input_tokens',0), \
  total_tokens=coalesce('message.usage.input_tokens',0)+coalesce('message.usage.output_tokens',0)+coalesce('message.usage.cache_read_input_tokens',0)+coalesce('message.usage.cache_creation_input_tokens',0)
iseval = 0

# === Cost calculation (reported per event) ===
# Prefer LiteLLM's response_cost and preserve an event's existing cost_usd.
[calculate_cost]
definition = `extract_tokens` \
  | eval model=coalesce(model, 'message.model', "unknown") \
  | eval cost_usd=tonumber(coalesce(response_cost, cost_usd))
iseval = 0

# === Composed metric base ===
# Canonical start of every dashboard base search: filtered assistant events,
# deduplicated, with tokens and any reported event cost attached.
[claude_metric_events]
definition = `claude_assistant_events` | `dedup_messages` | `calculate_cost`
iseval = 0

# === Tool extraction (with CIM Change fields) ===
[extract_tools]
definition = spath path="message.content{}" output=content_item \
  | mvexpand content_item \
  | spath input=content_item \
  | search type="tool_use" \
  | eval object=name, \
    object_path=coalesce('input.file_path','input.pattern','input.command','input.query'), \
    command=name
iseval = 0

# === Cache performance ===
[calculate_cache_pct]
definition = `extract_tokens` \
  | eval total_input=input_tokens+cache_read_tokens+cache_creation_tokens \
  | where total_input>0 \
  | eval cache_hit_pct=round(cache_read_tokens/total_input*100, 1)
iseval = 0
