# === Index macros (user-customizable; override in local/ on your search head) ===
[claude_index]
definition = (index=claude)
iseval = 0

[gemini_index]
definition = (index=gemini)
iseval = 0

[openai_index]
definition = (index=openai)
iseval = 0

[copilot_index]
definition = (index=vscode)
iseval = 0

# Composed from the per-provider index macros so a local/ override of any one
# of them propagates here. v0.2.0: index=ai dropped (nothing produces into it).
[ai_all_indexes]
definition = (`claude_index` OR `gemini_index` OR `openai_index` OR `copilot_index`)
iseval = 0

# === Base filter macros ===
[claude_assistant_events]
definition = `claude_index` sourcetype="claude:code:session" type="assistant"
iseval = 0

[claude_all_session_events]
definition = `claude_index` (sourcetype="claude:code:session" OR sourcetype="claude:code:subagent")
iseval = 0

# === Deduplication (ccusage pattern: messageId:requestId) ===
# Null-safe: dedup drops events whose key is null (keepempty defaults to
# false), so events missing requestId (synthetic/local messages) must fall
# back to uuid/"noreq" instead of producing a null key.
[dedup_messages]
definition = eval dedup_key=coalesce('message.id', uuid).":".coalesce(requestId, "noreq") | dedup dedup_key
iseval = 0

# === Token extraction (canonical 4-token model, ccusage-aligned) ===
# Canonical convenience fields match the props.conf EVALs:
# input_tokens, output_tokens, cache_read_tokens, cache_creation_tokens, total_tokens.
[extract_tokens]
definition = eval input_tokens=coalesce('message.usage.input_tokens',0), \
  output_tokens=coalesce('message.usage.output_tokens',0), \
  cache_read_tokens=coalesce('message.usage.cache_read_input_tokens',0), \
  cache_creation_tokens=coalesce('message.usage.cache_creation_input_tokens',0), \
  total_tokens=coalesce('message.usage.input_tokens',0)+coalesce('message.usage.output_tokens',0)+coalesce('message.usage.cache_read_input_tokens',0)+coalesce('message.usage.cache_creation_input_tokens',0)
iseval = 0

# === Cost calculation (lookup-driven; never drops events) ===
# Pricing comes from lookups/ai_model_pricing.csv via the wildcard lookup in
# transforms.conf. Unknown models cost $0 and are flagged pricing_known=false
# so dashboards can surface them instead of silently mis-pricing.
# cache_creation is priced at the 5-minute cache-write rate (1.25x input),
# matching what Claude Code reports in cache_creation_input_tokens.
[calculate_cost]
definition = `extract_tokens` \
  | eval model=coalesce(model, 'message.model', "unknown") \
  | lookup ai_model_pricing model_pattern AS model OUTPUT provider AS pricing_provider, model_family, input_cost_per_mtok, output_cost_per_mtok, cache_read_cost_per_mtok, cache_creation_cost_per_mtok \
  | eval pricing_known=if(isnull(input_cost_per_mtok) OR model_family="unknown", "false", "true") \
  | fillnull value=0 input_cost_per_mtok output_cost_per_mtok cache_read_cost_per_mtok cache_creation_cost_per_mtok \
  | eval cost_usd=(input_tokens*input_cost_per_mtok + output_tokens*output_cost_per_mtok + cache_read_tokens*cache_read_cost_per_mtok + cache_creation_tokens*cache_creation_cost_per_mtok)/1000000
iseval = 0

# === Composed metric base ===
# Canonical start of every dashboard base search: filtered assistant events,
# deduplicated, with tokens + lookup-driven cost attached.
[claude_metric_events]
definition = `claude_assistant_events` | `dedup_messages` | `calculate_cost`
iseval = 0

# === Tool extraction (with CIM Change fields) ===
[extract_tools]
definition = spath path="message.content{}" output=content_item \
  | mvexpand content_item \
  | spath input=content_item \
  | search type="tool_use" \
  | eval object=name, \
    object_path=coalesce('input.file_path','input.pattern','input.command','input.query'), \
    command=name
iseval = 0

# === Cache performance ===
[calculate_cache_pct]
definition = `extract_tokens` \
  | eval total_input=input_tokens+cache_read_tokens+cache_creation_tokens \
  | where total_input>0 \
  | eval cache_hit_pct=round(cache_read_tokens/total_input*100, 1)
iseval = 0

# === Full time accounting by inter-turn gap (per-source classification) ===
# The "AI Session Stall Classification (daily)" saved search only classifies
# OUTLIER stalls (5min-2hr gaps) and discards the rest. This macro removes
# that filter to account for 100% of elapsed time, bucketed into 5 categories
# instead of that search's finer 6-bucket "kind" field. Call as
# `claude_time_accounting_by_gap(<sessionId>)` for one session, or with
# sessionId="*" for fleet-wide accounting across every session.
#
# NOTE: uses sourcetype=claude:code* (wildcard), not the literal
# "claude:code:session" that claude_assistant_events/claude_all_session_events
# and eventtypes.conf hardcode -- production events actually land as bare
# sourcetype=claude:code (see the note on the [claude:code:session] stanza in
# props.conf). Restricted to type=assistant like claude_assistant_events,
# since `tool`/`ctype` below are extracted from the assistant turn's own
# message.content.
#
# Classification is per assistant turn: `tool` = tool_use name(s) issued by
# THIS turn, `ctype` = content type(s) of THIS turn. gap = elapsed seconds
# until the NEXT event on the same `source` (streamstats current=f over
# -_time order, same pattern as the stall search above).
#
#   SUBAGENT_WAIT   - tool_use name is Agent or Task (spawned subagent)
#   TOOL_EXEC       - any other tool_use (Bash, Read, MCP, etc.)
#   HUMAN_IDLE      - no tool_use, content type includes "text" (turn handed
#                     control back, session awaiting the next human input)
#   SYSTEM_OVERHEAD - no tool_use, no text content, gap<2s
#   MODEL_ACTIVE_CONFIRMED   - no tool_use, no text, gap>=2s, AND this row's
#                     own text/thinking content is non-empty (real evidence
#                     of generation).
#   MODEL_ACTIVE_UNVERIFIED  - same, but this row's text/thinking content is
#                     empty. ponytail: the 2s SYSTEM_OVERHEAD threshold is a
#                     starting guess, not a measured value -- tune it if
#                     dashboard data shows a different natural cutoff.
#
# IMPORTANT, verified directly against production (2026-07-24, 1hr window):
# every single row that reaches the MODEL_ACTIVE branch (no tool_use, no
# "text" content type) had EMPTY thinking content -- 0 rows had any measurable
# text/thinking chars. This is not a rare edge case, it's the norm in this
# dataset: Claude Code logs an empty placeholder "thinking" block as its own
# assistant-type transcript row, with the real content (text or a tool call)
# landing on a SEPARATE row a moment later. Because THIS macro classifies the
# gap AFTER a row by that row's OWN content, and any row that actually carries
# real text/tool content already gets swept into HUMAN_IDLE/TOOL_EXEC before
# ever reaching this branch, MODEL_ACTIVE_CONFIRMED will read near-zero here
# by construction -- that is an accurate reflection of what THIS gap-shape
# can prove, not a bug. The companion Python tool
# (scripts/time_accounting/session_timeline.py) uses a DIFFERENT attribution
# model -- it classifies the gap BEFORE each assistant-type row by THAT row's
# own output (text + thinking + tool-input chars combined), so a text-bearing
# row's generation time gets credited as confirmed even though the row itself
# then becomes a HUMAN_IDLE boundary. Measured on a live session: the Python
# tool found ~56% of what it calls MODEL_ACTIVE time was confirmed and ~44%
# unverified -- meaningfully different from this macro's near-all-unverified
# residual bucket. Both are correct under their own definitions; they are NOT
# directly comparable numbers. Use the Python tool when you need the more
# complete picture; use this macro for a fast native-SPL first pass.
#
# Known limitation: classification is per-`source` (one session/subagent
# JSONL file) in isolation, so a HUMAN_IDLE-looking gap in the main session
# that actually overlapped with a concurrently-running subagent in a
# DIFFERENT `source` is NOT reclassified as SUBAGENT_WAIT -- that needs
# joining across `source` values sharing the same sessionId + time window
# (what a local JSONL-parsing script can do cross-file), out of scope here.
[claude_time_accounting_by_gap(1)]
args = sessionId
definition = `claude_index` sourcetype=claude:code* type=assistant sessionId=$sessionId$ \
  | sort 0 source -_time \
  | streamstats current=f last(_time) as nxt by source \
  | eval gap=nxt-_time \
  | spath path="message.content{}.name" output=tool \
  | spath path="message.content{}.type" output=ctype \
  | spath path="message.content{}.text" output=text_mv \
  | spath path="message.content{}.thinking" output=thinking_mv \
  | eval output_chars=coalesce(len(mvjoin(text_mv,"")),0)+coalesce(len(mvjoin(thinking_mv,"")),0) \
  | eval time_category=case( \
      isnotnull(mvfind(tool,"Agent")) OR isnotnull(mvfind(tool,"Task")),"SUBAGENT_WAIT", \
      isnotnull(tool),"TOOL_EXEC", \
      isnotnull(mvfind(ctype,"text")),"HUMAN_IDLE", \
      gap<2,"SYSTEM_OVERHEAD", \
      output_chars>0,"MODEL_ACTIVE_CONFIRMED", \
      1=1,"MODEL_ACTIVE_UNVERIFIED") \
  | stats count as turns sum(gap) as gap_sec by time_category \
  | eval gap_min=round(gap_sec/60,1)
iseval = 0
